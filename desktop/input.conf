# CanalPeer keys: every action goes to the app, which decides (see player.go).
LEFT        script-message canalpeer back
RIGHT       script-message canalpeer forward
DOWN        script-message canalpeer back60 # movies only
UP          script-message canalpeer forward60
SPACE       script-message canalpeer pause
a           script-message canalpeer audio
i           script-message canalpeer info
f           script-message canalpeer fullscreen
ESC         script-message canalpeer esc
Ctrl+v      script-message canalpeer paste
Meta+v      script-message canalpeer paste
u           script-message canalpeer update
CLOSE_WIN   quit 5 # back to the launcher; mpv closes itself even if the app is gone
WHEEL_UP    add volume 5 # the player's own, like the speaker on screen
WHEEL_DOWN  add volume -5
m           cycle mute
